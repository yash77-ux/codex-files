<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d1a">
  <meta name="description" content="Get in touch.">
  <title>Contact — Hello, World!</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #090d1a; color: #f7f8ff; font-synthesis: none; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 110%, rgba(79,83,186,.24), transparent 50%), radial-gradient(circle at 18% 17%, rgba(61,185,192,.12), transparent 28%), #090d1a; }
    .nav { position: fixed; z-index: 2; top: 22px; right: 24px; left: 24px; display: flex; justify-content: center; gap: 10px; }
    .nav a { padding: 9px 14px; border: 1px solid rgba(255,255,255,.12); border-radius: 999px; color: #cbd2e8; text-decoration: none; font-size: .82rem; transition: background .2s, color .2s; }
    .nav a:hover, .nav a[aria-current="page"] { color: white; background: rgba(255,255,255,.1); }
    main { width: min(100% - 32px, 720px); padding: clamp(36px, 7vw, 68px); border: 1px solid rgba(255,255,255,.1); border-radius: 28px; background: linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.025)); box-shadow: 0 30px 100px rgba(0,0,0,.25); backdrop-filter: blur(18px); }
    .eyebrow { margin: 0 0 18px; color: #70e6df; font-size: .75rem; font-weight: 700; letter-spacing: .19em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3rem, 9vw, 6rem); font-weight: 760; letter-spacing: -.075em; line-height: 1; background: linear-gradient(100deg, #fff 8%, #c6c4ff 52%, #78e3db 95%); background-clip: text; -webkit-background-clip: text; color: transparent; }
    .copy { margin: 20px 0 30px; color: #a7b0ca; font-size: 1.05rem; line-height: 1.75; }
    form { display: grid; gap: 17px; }
    label { display: grid; gap: 8px; color: #dce1f1; font-size: .87rem; font-weight: 600; }
    input, textarea { width: 100%; border: 1px solid rgba(255,255,255,.15); border-radius: 12px; outline: none; padding: 13px 15px; color: #f7f8ff; background: rgba(8,12,27,.55); font: inherit; font-size: .95rem; transition: border-color .2s, box-shadow .2s; }
    input:focus, textarea:focus { border-color: #9a8cff; box-shadow: 0 0 0 3px rgba(154,140,255,.16); }
    textarea { min-height: 120px; resize: vertical; }
    button { justify-self: start; min-height: 48px; margin-top: 3px; padding: 0 20px; border: 0; border-radius: 999px; color: #101426; background: linear-gradient(110deg, #d4d0ff, #9cebe4); font: inherit; font-size: .9rem; font-weight: 700; cursor: pointer; transition: transform .2s; }
    button:hover { transform: translateY(-2px); }
    #status { min-height: 1.5em; margin: 0; color: #9cebe4; font-size: .9rem; }
    footer { position: fixed; right: 20px; bottom: 18px; left: 20px; color: #69738e; font-size: .72rem; letter-spacing: .08em; text-align: center; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <nav class="nav" aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html" aria-current="page">Contact</a>
  </nav>
  <main>
    <p class="eyebrow">Your turn</p>
    <h1>Let’s talk.</h1>
    <p class="copy">Have a thought, a question, or just want to say hello? Drop a note below.</p>
    <form id="contact-form">
      <label for="name">Your name<input id="name" name="name" autocomplete="name" required placeholder="Ada Lovelace"></label>
      <label for="email">Email address<input id="email" name="email" type="email" autocomplete="email" required placeholder="ada@example.com"></label>
      <label for="message">Message<textarea id="message" name="message" required placeholder="Write your message here…"></textarea></label>
      <button type="submit">Send a note&nbsp; →</button>
      <p id="status" aria-live="polite"></p>
    </form>
  </main>
  <footer>MADE WITH A LITTLE CURIOSITY&nbsp; ✦</footer>
  <script>
    document.querySelector('#contact-form').addEventListener('submit', (event) => {
      event.preventDefault();
      document.querySelector('#status').textContent = 'Thanks for your note! This demo form is ready to connect to an inbox.';
      event.currentTarget.reset();
    });
  </script>
</body>
</html>
