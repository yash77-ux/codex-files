<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d1a">
  <meta name="description" content="A little hello from the web.">
  <title>Hi, my name is Yash!</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090d1a;
      color: #f7f8ff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --muted: #a7b0ca;
      --accent: #9a8cff;
      --cyan: #70e6df;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 110%, rgba(79, 83, 186, .24), transparent 50%),
        radial-gradient(circle at 18% 17%, rgba(61, 185, 192, .12), transparent 28%),
        #090d1a;
    }

    .scene {
      position: relative;
      isolation: isolate;
      width: min(100% - 32px, 900px);
      padding: clamp(44px, 9vw, 96px) 24px;
      text-align: center;
    }

    .orb {
      position: absolute;
      z-index: -1;
      width: 300px;
      aspect-ratio: 1;
      top: 50%;
      left: 50%;
      border-radius: 50%;
      transform: translate(-50%, -58%);
      background: linear-gradient(135deg, rgba(112, 230, 223, .26), rgba(154, 140, 255, .25) 55%, rgba(247, 143, 204, .18));
      filter: blur(80px);
      opacity: .8;
      animation: breathe 7s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 26px;
      color: #c7c9e7;
      font-size: .75rem;
      font-weight: 650;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    .spark {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 16px var(--cyan);
    }

    h1 {
      margin: 0;
      font-size: clamp(4rem, 12vw, 8.5rem);
      font-weight: 760;
      letter-spacing: -.085em;
      line-height: .98;
    }

    h1 span {
      display: block;
      padding-right: .08em;
      background: linear-gradient(100deg, #fff 8%, #c6c4ff 48%, #78e3db 92%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .subtitle {
      max-width: 440px;
      margin: 26px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      line-height: 1.7;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 50px;
      margin-top: 34px;
      padding: 0 22px;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 999px;
      color: #101426;
      background: linear-gradient(110deg, #d4d0ff, #9cebe4);
      box-shadow: 0 8px 32px rgba(112, 230, 223, .14);
      font: inherit;
      font-size: .9rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .button:hover { transform: translateY(-3px); box-shadow: 0 12px 38px rgba(112, 230, 223, .25); }
    .button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    .button svg { width: 16px; height: 16px; }

    .note {
      min-height: 1.5em;
      margin: 16px 0 0;
      color: #c4c9dc;
      font-size: .88rem;
    }

    .footer {
      position: fixed;
      right: 20px;
      bottom: 18px;
      left: 20px;
      color: #69738e;
      font-size: .72rem;
      letter-spacing: .08em;
      text-align: center;
    }

    .nav { position: fixed; top: 22px; right: 24px; left: 24px; display: flex; justify-content: center; gap: 10px; }
    .nav a { padding: 9px 14px; border: 1px solid rgba(255,255,255,.12); border-radius: 999px; color: #cbd2e8; text-decoration: none; font-size: .82rem; transition: background .2s, color .2s; }
    .nav a:hover, .nav a[aria-current="page"] { color: white; background: rgba(255,255,255,.1); }

    @keyframes breathe { from { transform: translate(-50%, -58%) scale(.88); } to { transform: translate(-50%, -58%) scale(1.12); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <nav class="nav" aria-label="Main navigation">
    <a href="index.html" aria-current="page">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
  <main class="scene">
    <div class="orb" aria-hidden="true"></div>
    <p class="eyebrow"><span class="spark" aria-hidden="true"></span> A small beginning</p>
    <h1><span>Hello,</span><span>World!</span></h1>
    <p class="subtitle">One tiny page, a whole universe of possibilities. Thanks for stopping by.</p>
    <button class="button" id="hello-button" type="button">
      Say hello
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <p class="note" id="message" aria-live="polite"></p>
  </main>
  <footer class="footer">MADE WITH A LITTLE CURIOSITY&nbsp; ✦</footer>
  <script>
    const button = document.querySelector('#hello-button');
    const message = document.querySelector('#message');
    button.addEventListener('click', () => {
      message.textContent = 'Hello right back at you ✨';
      button.innerHTML = 'Lovely to meet you <span aria-hidden="true">✦</span>';
    });
  </script>
</body>
</html>
